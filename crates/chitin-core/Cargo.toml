[package]
name = "chitin-core"
description = "Minimal Wayland compositor core — protocol server, surface management, event loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustix = { version = "1.0", features = ["event", "fs", "net"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-protocols = { version = "0.32.13", default-features = false }
wayland-server = "0.31.14"

[lints]
workspace = true

[dev-dependencies]
wayland-client = "0.31"
libc = "0.2"
