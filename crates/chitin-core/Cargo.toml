[package]
name = "chitin-core"
description = "Minimal Wayland compositor core — protocol server, surface management, event loop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
rustix = { version = "1.0", features = ["event", "fs", "net"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["server"] }
wayland-server = "0.31.14"
wgpu = "26"
bytemuck = { version = "1", features = ["derive"] }
mio = "1"
slab = "0.4"
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
wayland-client = "0.31"
libc = "0.2"
