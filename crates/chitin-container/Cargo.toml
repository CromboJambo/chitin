[package]
name = "chitin-container"
description = "Containerized deployment for chitin compositor (spec 06)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crabjar-podman = { git = "https://github.com/CromboJambo/crabjar.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chitin-container"
path = "src/bin/chitin-container.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap", "dep:tracing-subscriber"]
